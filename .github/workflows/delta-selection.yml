name: Apply Delta-style scanner selection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner selection
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("MAX_SCAN=31", "MAX_SCAN=50", 1)
          old_scan = "tickers=(all||[]).filter(t=>map.has(t.symbol)).sort((a,b)=>Math.abs(n(b.priceChangePercent))-Math.abs(n(a.priceChangePercent)));"
          new_scan = "tickers=(all||[]).filter(t=>map.has(t.symbol)).sort((a,b)=>Math.abs(n(b.priceChangePercent))-Math.abs(n(a.priceChangePercent))).slice(0,MAX_SCAN);"
          if old_scan in s:
              s = s.replace(old_scan, new_scan, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit scanner patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          if git diff --cached --quiet; then
            echo 'No scanner selection changes needed.'
          else
            git commit -m 'Enforce Binance top 50 by absolute 24H change'
            git push
          fi