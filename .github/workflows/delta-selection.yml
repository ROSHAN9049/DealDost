name: Apply Delta-style scanner selection

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Binance scanner to Delta-style Top 50 compact view
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('MAX_SCAN=31', 'MAX_SCAN=50', 1)
          old_scan = "tickers=(all||[]).filter(t=>map.has(t.symbol)).sort((a,b)=>Math.abs(n(b.priceChangePercent))-Math.abs(n(a.priceChangePercent)));"
          new_scan = "tickers=(all||[]).filter(t=>map.has(t.symbol)).sort((a,b)=>Math.abs(n(b.priceChangePercent))-Math.abs(n(a.priceChangePercent))).slice(0,MAX_SCAN);"
          if old_scan in s:
              s=s.replace(old_scan,new_scan,1)
          start=s.find('function renderSignals(rows){')
          end=s.find('function paperOpen(',start)
          if start>=0 and end>start:
              fn='''function renderSignals(rows){const b=$(\'signals\');if(!b)return;const search=(($(\'search\')?.value||\'\').trim().toUpperCase()).replace(\'/\',\'\'),visible=search?rows.filter(r=>r.t.symbol.includes(search)):rows;b.innerHTML=visible.map((r,i)=>{const a=r.mom,z=r.scalp,best=a?.signal===\'LONG\'||a?.signal===\'SHORT\'?a:(z?.signal===\'LONG\'||z?.signal===\'SHORT\'?z:null);const sig=best?.signal||\'WATCH\',score=best?.score||Math.max(a?.score||0,z?.score||0),sr=best===a?(z?.score||0):(a?.score||0);return`<tr class="${sig===\'LONG\'?\'rowLong\':sig===\'SHORT\'?\'rowShort\':\'\'}"><td>${i+1}</td><td><b>${r.t.symbol}</b></td><td>${n(r.t.lastPrice).toLocaleString()}</td><td class="${n(r.t.priceChangePercent)>=0?\'long\':\'short\'}">${n(r.t.priceChangePercent)>=0?\'+\':\'\'}${n(r.t.priceChangePercent).toFixed(2)}%</td><td>$${(n(r.t.quoteVolume)/1e6).toFixed(2)}M</td><td class="${(a?.trend||\'WAIT\').startsWith(\'BULLISH\')?\'long\':\'short\'}">${a?.trend||\'WAIT\'}</td><td>${score}</td><td class="${cls(best)}">${sig}</td><td>${sr||\'—\'}</td><td>${best?.sl?`<button class="signalBtn" data-s="${encodeURIComponent(JSON.stringify(best))}">Paper Entry</button>`:\'WATCH\'}</td></tr>`}).join(\'\')||\'<tr><td colspan="10" class="empty">No matching coins.</td></tr>\';b.querySelectorAll(\'.signalBtn\').forEach(q=>q.onclick=()=>paperOpen(JSON.parse(decodeURIComponent(q.dataset.s))));set(\'scannerInfo\',`${visible.length} coins · Delta 24H change order`);const qualifying=rows.filter(r=>r.mom?.signal===\'LONG\'||r.mom?.signal===\'SHORT\'||r.scalp?.signal===\'LONG\'||r.scalp?.signal===\'SHORT\').length;set(\'signalCount\',`${qualifying} qualifying signals`)}\n'''
              s=s[:start]+fn+s[end:]
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          old='<th>CONTRACT</th><th>PRICE</th><th>24H CHANGE</th><th>VOLUME</th><th>MOMENTUM</th><th>SCORE</th><th>SIGNAL</th><th>SCALPING</th><th>SCORE</th><th>SIGNAL</th><th>SIGNAL REASON</th><th>ACTION</th>'
          new='<th>#</th><th>COIN</th><th>PRICE</th><th>24H CHANGE</th><th>VOLUME</th><th>MOMENTUM</th><th>SCORE</th><th>SIGNAL</th><th>S/R</th><th>ACTION</th>'
          if old in h:h=h.replace(old,new,1)
          h=h.replace('colspan="12" class="empty"','colspan="10" class="empty"')
          h=h.replace('All eligible contracts discovered; top 31 liquid contracts analysed each scan for Delta-style compact view','All eligible perpetual contracts discovered; Top 50 selected by absolute 24H change for Delta-style compact view')
          h=h.replace('style.css?v=20260908-9','style.css?v=20260909-1').replace('delta-coin-view.css?v=20260908-1','delta-coin-view.css?v=20260909-2').replace('app.js?v=20260908-7','app.js?v=20260909-2').replace('stable-ui.js?v=20260908-5','stable-ui.js?v=20260909-2')
          p.write_text(h,encoding='utf-8')

          p=Path('style.css')
          c=p.read_text(encoding='utf-8')
          extra='''\n/* Delta-style Top-50 compact scanner */\n.deltaCompact th,.deltaCompact td{padding:7px 9px;font-size:10px}.deltaCompact th{font-size:8px}.deltaCompact td:nth-child(1){text-align:center;color:#718099;width:28px}.deltaCompact td:nth-child(2){font-weight:900}.deltaCompact td:nth-child(4){font-weight:900}.deltaCompact td:nth-child(7),.deltaCompact td:nth-child(8),.deltaCompact td:nth-child(9){text-align:center}.deltaCompact td:nth-child(10){text-align:center}.deltaCompact .signalBtn{padding:5px 8px;font-size:9px}\n@media(max-width:700px){.deltaCompact{min-width:760px}.deltaCompact th,.deltaCompact td{padding:7px 8px;font-size:9px}.deltaCompact th{font-size:7px}}\n'''
          if '/* Delta-style Top-50 compact scanner */' not in c:c+=extra
          p.write_text(c,encoding='utf-8')
          PY
      - name: Commit scanner patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html style.css
          if git diff --cached --quiet; then
            echo 'No scanner changes needed.'
          else
            git commit -m 'Make Binance scanner match Delta-style Top 50 compact coin table'
            git push
          fi
