name: Fix scanner universe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/both.jsx')
          s=p.read_text()
          old="""const applyTickers=next=>{if(!next||!Object.keys(next).length)return;Object.assign(tickBuffer.current,next);const syms=Object.keys(next).filter(s=>/USDT$/.test(s));if(syms.length){setUniverse(prev=>{const old=prev||[],set=new Set(old),added=syms.filter(s=>!set.has(s));if(!added.length)return prev;const merged=[...old,...added].sort();try{localStorage.setItem('scanner-universe-v1',JSON.stringify(merged))}catch{}return merged})}setBusy(false);setErr('');if(!tickFlushTimer.current)tickFlushTimer.current=setTimeout(flushTicks,250);if(!scanTickTimer.current)scanTickTimer.current=setTimeout(()=>{scanTickTimer.current=null;setScanCount(c=>c+1)},5000)};"""
          new="""const applyTickers=next=>{if(!next||!Object.keys(next).length)return;Object.assign(tickBuffer.current,next);setBusy(false);setErr('');if(!tickFlushTimer.current)tickFlushTimer.current=setTimeout(flushTicks,250);if(!scanTickTimer.current)scanTickTimer.current=setTimeout(()=>{scanTickTimer.current=null;setScanCount(c=>c+1)},5000)};"""
          if old not in s: raise SystemExit('applyTickers pattern not found')
          s=s.replace(old,new)
          old="""const scannerOrder=useMemo(()=>[...market].filter(x=>x.price).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change)||a.symbol.localeCompare(b.symbol)).slice(0,50),[market]);"""
          new="""const scannerOrder=useMemo(()=>universe.map(symbol=>market.find(x=>x.symbol===symbol)).filter(Boolean),[universe,market]);const analysisBatch=useMemo(()=>{const active=scannerOrder.filter(x=>x.price);if(!active.length)return[];const size=50,offset=(Math.floor(analysisVersion/5)*size)%active.length;return Array.from({length:Math.min(size,active.length)},(_,i)=>active[(offset+i)%active.length])},[scannerOrder,analysisVersion]);"""
          if old not in s: raise SystemExit('scannerOrder pattern not found')
          s=s.replace(old,new)
          s=s.replace("[scannerOrder]);\n useEffect(()=>{if(!scannerOrder.length||deepRunning.current)return;", "[analysisBatch]);\n useEffect(()=>{if(!analysisBatch.length||deepRunning.current)return;")
          s=s.replace("const ranked=scannerOrder.map(x=>x.symbol);", "const ranked=analysisBatch.map(x=>x.symbol);")
          s=s.replace("const targets=scannerOrder,out=[];", "const targets=analysisBatch,out=[];")
          old="""const display=useMemo(()=>{const analysed=new Map(rows.map(x=>[x.symbol,x]));return scannerOrder.map(x=>analysed.get(x.symbol)||x).slice(0,20)},[scannerOrder,rows]);"""
          new="""const display=useMemo(()=>{const analysed=new Map(rows.map(x=>[x.symbol,x]));return [...market].filter(x=>x.price).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change)||a.symbol.localeCompare(b.symbol)).slice(0,20).map(x=>analysed.get(x.symbol)||x)},[market,rows]);"""
          if old not in s: raise SystemExit('display pattern not found')
          s=s.replace(old,new)
          s=s.replace("${deepCount?`${deepCount} top-50 24H-change coins analysed · `:'Warming live candles · '}", "${deepCount?`${deepCount} coins analysed in rotating batches · `:'Warming live candles · '}")
          s=s.replace("50 fixed top-50 coins analysed", "50-coin rotating batches across the full stable universe")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/both.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix stable coin universe and rotate full scanner analysis"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/fix-scanner-universe.yml
          git commit -m "Remove one-time scanner fix workflow"
          git push
