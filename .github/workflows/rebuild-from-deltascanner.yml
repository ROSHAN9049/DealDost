name: Rebuild DealDost as Binance Scanner

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DealDost
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Copy deltascanner and convert market feed to Binance
        shell: bash
        run: |
          set -e
          rm -rf /tmp/deltascanner
          curl -L --fail --retry 3 https://github.com/ROSHAN9049/deltascanner/archive/refs/heads/main.tar.gz -o /tmp/delta.tgz
          mkdir -p /tmp/deltascanner
          tar -xzf /tmp/delta.tgz -C /tmp/deltascanner --strip-components=1

          rm -rf ./* ./.??* 2>/dev/null || true
          cp -a /tmp/deltascanner/. .
          rm -rf .git
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git checkout -b main

          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('src/both.jsx')
          s=p.read_text()

          s=s.replace(
              "const API='https://api.india.delta.exchange/v2/tickers?contract_types=perpetual_futures',CANDLE='https://api.india.delta.exchange/v2/history/candles',START=10000;",
              "const API='https://fapi.binance.com/fapi/v1/ticker/24hr',CANDLE='https://fapi.binance.com/fapi/v1/klines',START=10000;"
          )

          s=s.replace(
              "const priceOf=r=>[r?.ltp,r?.last_price,r?.mark_price,r?.close,r?.last5,r?.last1].map(num).find(v=>v>0)||0;",
              "const priceOf=r=>[r?.lastPrice,r?.last_price,r?.ltp,r?.markPrice,r?.mark_price,r?.close,r?.last5,r?.last1].map(num).find(v=>v>0)||0;"
          )

          s=re.sub(
              r"async function candles\(symbol,res,count\)\{.*?\n\}",
              """async function candles(symbol,res,count){const r=await fetch(`${CANDLE}?symbol=${encodeURIComponent(symbol)}&interval=${res}&limit=${count}`,{cache:'no-store'});if(!r.ok)throw Error('Binance candle HTTP '+r.status);const j=await r.json();return(Array.isArray(j)?j:[]).map(k=>({time:num(k[0]),open:num(k[1]),high:num(k[2]),low:num(k[3]),close:num(k[4]),volume:num(k[5])})).sort((a,b)=>num(a.time)-num(b.time))}
""",
              s,count=1,flags=re.S
          )

          old="const j=await r.json(),raw=(Array.isArray(j.result)?j.result:[]).filter(x=>x.symbol&&x.contract_type==='perpetual_futures'),base=raw.map(x=>({...x,change:num(x.ltp_change_24h),volume:num(x.turnover_usd),marketPrice:priceOf(x)}))"
          new="const j=await r.json(),raw=(Array.isArray(j)?j:[]).filter(x=>x.symbol&&/USDT$/.test(x.symbol)),base=raw.map(x=>({...x,change:num(x.priceChangePercent),volume:num(x.quoteVolume),marketPrice:priceOf(x)}))"
          if old not in s:
              raise SystemExit('Binance load mapping target not found')
          s=s.replace(old,new)
          s=s.replace('Delta API HTTP','Binance API HTTP')
          s=s.replace('No perpetual coins returned by Delta Exchange','No Binance USDT perpetual coins returned')
          s=s.replace('Delta Exchange','Binance Futures')
          s=s.replace('Delta','Binance')
          p.write_text(s)

          idx=Path('index.html')
          t=idx.read_text().replace('Delta Exchange India live combined','Binance Futures live combined').replace('Delta Scanner','Binance Scanner')
          idx.write_text(t)

          pkg=Path('package.json')
          t=pkg.read_text().replace('"name": "delta-scanner"','"name": "binance-scanner"')
          t=t.replace('node scripts/fix-candles.mjs && node scripts/risk-guards.mjs && node scripts/opportunity-engine.mjs && vite build','vite build')
          pkg.write_text(t)

          read=Path('README.md')
          if read.exists():
              read.write_text(read.read_text().replace('Delta Exchange India','Binance USDⓈ-M Futures').replace('Delta Scanner','Binance Scanner').replace('Delta','Binance'))
          PY

          rm -rf .git
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -m "Rebuild DealDost from deltascanner as Binance paper scanner"
          git push --force origin HEAD:main
