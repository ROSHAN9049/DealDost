name: Restore dynamic coin scanner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original dynamic Binance universe
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text()
          pattern=r"function readStable\(\).*?function renderRadar"
          replacement="""function readStable(){return []}
          function writeStable(a){}
          function selectStableUniverse(all,map){
            return (all||[]).filter(t=>map.has(t.symbol))
              .sort((a,b)=>Math.abs(n(b.priceChangePercent))-Math.abs(n(a.priceChangePercent)))
              .slice(0,MAX_SCAN);
          }
          function renderRadar"""
          ns,count=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if count!=1:
              raise SystemExit('stable selection block not found')
          ns=ns.replace("set('connection','Loading Binance Futures…');set('scannerInfo','Loading stable Binance universe…')","set('connection','Loading Binance Futures…');set('scannerInfo','Discovering eligible perpetual contracts…')")
          ns=ns.replace("set('scannerInfo',`${tickers.length} stable coins · live Binance price/24H/volume`)","set('scannerInfo',`${tickers.length} live Binance coins · price/24H/volume`)")
          ns=ns.replace("set('scannerInfo',`${rows.length}/${candleCandidates.length} stable coins analysed · order locked`)","set('scannerInfo',`${rows.length}/${candleCandidates.length} coins analysed`)")
          ns=ns.replace("set('connection',`LIVE · Binance Futures · stable ${tickers.length}/${contracts.length} · paper only`)","set('connection',`LIVE · Binance Futures · ${tickers.length}/${contracts.length} · paper only` )")
          ns=ns.replace("set('scannerInfo',`${visible.length} coins · Delta 24H change order`)","set('scannerInfo',`${visible.length} coins · Delta 24H change order`)")
          p.write_text(ns)
          PY
          rm -f .github/workflows/restore-dynamic-coins.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js .github/workflows/restore-dynamic-coins.yml
          git commit -m 'Restore dynamic Binance coin universe'
          git push