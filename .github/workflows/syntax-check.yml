name: DealDost Syntax Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in app.js app-fixed.js app-professional.js app-professional-v2.js app-scanner-v3.js app-strong.js app-strong-v2.js app-terminal.js api/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
