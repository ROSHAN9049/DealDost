name: DealDost validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check terminal
        run: node --check app-terminal.js
      - name: Verify safety defaults
        run: |
          grep -q "liveAuto:false" app-terminal.js
          grep -q "liveTrading:false" app-terminal.js
          grep -q "emergencyStop:false" app-terminal.js
          grep -q "if(!x.confirmed)return false" app-terminal.js
          grep -q "MC=3,SC=3,OC=4" app-terminal.js
