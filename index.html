<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>Binance Command Center</title><style>
*{box-sizing:border-box}body{margin:0;background:#060a12;color:#e8eef8;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1500px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;background:#0c1421;border:1px solid #20314a;border-radius:16px}.brand{font-size:22px;font-weight:900}.muted{color:#8191a8}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22df89;margin-right:7px}.mode button,.nav button,.controls button{border:1px solid #2a3d58;background:#101c2b;color:#c8d5e6;border-radius:9px;padding:8px 12px;cursor:pointer}.mode .on,.nav .active{background:#1b5f48;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.card,.panel{background:#0b131f;border:1px solid #1d2d43;border-radius:14px;padding:13px}.metric{font-size:23px;font-weight:900;margin-top:4px}.green{color:#35df8c}.red{color:#ff6275}.yellow{color:#ffd166}.blue{color:#5ba7ff}.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button{white-space:nowrap}.panel{margin-bottom:10px}.panel h2{margin:0 0 4px}.sub{font-size:12px;color:#7e8fa7;margin-bottom:10px}.engine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{padding:11px;border:1px solid #263951;border-radius:11px;background:#0d1826}.slot b{font-size:18px}.bar{height:6px;background:#172638;border-radius:8px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:#29c982}.tablewrap{overflow:auto;border:1px solid #1c2b40;border-radius:10px}table{width:100%;min-width:950px;border-collapse:collapse}th,td{padding:8px 9px;border-bottom:1px solid #172438;white-space:nowrap;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}th{font-size:11px;color:#8294ac;background:#111b29}.buyrow{background:rgba(30,180,110,.08)}.sellrow{background:rgba(240,70,90,.08)}.badge{padding:3px 7px;border-radius:99px;font-size:11px;font-weight:800}.buy{color:#35df8c}.sell{color:#ff6275}.watch{color:#8797aa}.badge.buy{background:#123b2b}.badge.sell{background:#421c26}.badge.watch{background:#192536}.positions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.pos{padding:11px;border:1px solid #263951;border-radius:11px;background:#0d1826}.kv{display:flex;justify-content:space-between;margin-top:5px;color:#8495ab}.kv b{color:#e8eef8}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input{width:90px;background:#09121e;color:#fff;border:1px solid #2a3d58;border-radius:8px;padding:8px}.notice{padding:11px;border-radius:9px;background:#111d2c;color:#91a1b6}.footer{text-align:center;color:#60728a;padding:16px;font-size:11px}@media(max-width:800px){.grid,.engine{grid-template-columns:repeat(2,1fr)}.brand{font-size:18px}}@media(max-width:480px){.app{padding:7px}.grid{grid-template-columns:1fr 1fr}.top{padding:12px}}
</style></head><body><div id="app"></div><script>
(function(){'use strict';
var S={mode:'PAPER',tab:'overview',universe:[],ticks:{},analysis:{},history:[],positions:[],equity:10000,realized:0,risk:.5,last:0,deep:0,scanning:false,auto:true,opts:[],optionPositions:[]};
var K='bd-v2',cursor=0,ws=null,wsRetry=0;
function q(x){return document.querySelector(x)} function num(x){var v=Number(x);return isFinite(v)?v:0} function money(x){return '₹'+num(x).toLocaleString('en-IN',{maximumFractionDigits:2})} function pct(x){return (num(x)>=0?'+':'')+num(x).toFixed(2)+'%'} function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function save(){try{localStorage.setItem(K,JSON.stringify({mode:S.mode,history:S.history.slice(-300),positions:S.positions,equity:S.equity,realized:S.realized,risk:S.risk}))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem(K)||'{}');if(x&&typeof x==='object'){if(x.mode)S.mode=x.mode;if(Array.isArray(x.history))S.history=x.history;if(Array.isArray(x.positions))S.positions=x.positions;if(num(x.equity)>0)S.equity=num(x.equity);S.realized=num(x.realized);S.risk=num(x.risk)||.5}}catch(e){}}
function api(path){return fetch('/api/binance-market?path='+encodeURIComponent(path),{cache:'no-store'}).then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw Error('Bad API response '+r.status)}if(!r.ok)throw Error((j&&j.error)||('Binance API '+r.status));return j})})}
function ema(a,p){if(!a.length)return 0;p=p||9;var k=2/(p+1),e=num(a[0]),i;for(i=1;i<a.length;i++)e=num(a[i])*k+e*(1-k);return e}
function atr(a,p){p=p||14;if(a.length<p+1)return 0;var s=0,i;for(i=a.length-p;i<a.length;i++){var h=num(a[i][2]),l=num(a[i][3]),pc=num(a[i-1][4]);s+=Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc))}return s/p}
function analyze(sym){var k=S.klines&&S.klines[sym];var t=S.ticks[sym];if(!k||!t)return{signal:'WATCH',score:0,spike:0,trend5:'WAIT',trend15:'WAIT',atr:0};var c1=k.m1.map(function(x){return num(x[4])}),c5=k.m5.map(function(x){return num(x[4])}),c15=k.m15.map(function(x){return num(x[4])}),v=k.m5.map(function(x){return num(x[5])});if(c5.length<20||c15.length<20)return{signal:'WATCH',score:0,spike:0,trend5:'WAIT',trend15:'WAIT',atr:0};var l1=c1[c1.length-1],p1=c1[c1.length-2],l5=c5[c5.length-1],p5=c5[c5.length-2],l15=c15[c15.length-1];var e1=ema(c1,9),e5=ema(c5,9),e15=ema(c15,13),b5=l5>e5&&l5>p5,b15=l15>e15,d5=l5<e5&&l5<p5,d15=l15<e15;var base=0,i;for(i=Math.max(0,v.length-11);i<v.length-1;i++)base+=v[i];base=base/Math.max(1,Math.min(10,v.length-1));var spike=base?v[v.length-1]/base:0,trend=b5&&b15?'BUY':d5&&d15?'SELL':'WATCH',dir=t.c>0?'BUY':t.c<0?'SELL':'WATCH';var score=Math.round(Math.min(Math.abs(t.c)*7,35)+Math.min(spike*14,30)+(trend!=='WATCH'?35:0));return{signal:trend===dir&&spike>=1.15&&score>=68?trend:'WATCH',score:score,spike:spike,trend5:b5?'BULLISH':d5?'BEARISH':'WAIT',trend15:b15?'BULLISH':d15?'BEARISH':'WAIT',atr:atr(k.m5),price:t.p,change:t.c}}
async function loadUniverse(){S.scanning=true;render();try{var e=await api('/fapi/v1/exchangeInfo');var syms=(e.symbols||[]).filter(function(x){return x.contractType==='PERPETUAL'&&x.quoteAsset==='USDT'&&x.status==='TRADING'}).map(function(x){return x.symbol}).sort();S.universe=syms;var t=await api('/fapi/v1/ticker/24hr');var map={};(Array.isArray(t)?t:[]).forEach(function(x){if(syms.indexOf(x.symbol)>=0)map[x.symbol]={p:num(x.lastPrice),c:num(x.priceChangePercent),v:num(x.quoteVolume)}});S.ticks=map;S.last=Date.now();S.klines={};cursor=0;S.deep=0;connectWS();await scanBatch();}catch(e){S.error=e.message;console.error(e)}S.scanning=false;render()}
async function scanBatch(){if(!S.universe.length||S.scanningBatch)return;S.scanningBatch=true;try{var batch=[],i;for(i=0;i<18&&i<S.universe.length;i++){var idx=(cursor+i)%S.universe.length;batch.push(S.universe[idx])}cursor=(cursor+batch.length)%S.universe.length;await Promise.all(batch.map(async function(sym){try{var r=await Promise.all(['1m','5m','15m'].map(function(iv){return api('/fapi/v1/klines?symbol='+sym+'&interval='+iv+'&limit=40')}));S.klines[sym]={m1:r[0],m5:r[1],m15:r[2]};S.analysis[sym]=analyze(sym);S.deep++}catch(e){}}));autoEngine();}finally{S.scanningBatch=false;render()}}
function connectWS(){if(ws)try{ws.close()}catch(e){}try{ws=new WebSocket('wss://fstream.binance.com/stream');ws.onopen=function(){wsRetry=0;ws.send(JSON.stringify({method:'SUBSCRIBE',params:['!ticker@arr'],id:7}))};ws.onmessage=function(ev){try{var z=JSON.parse(ev.data),a=Array.isArray(z)?z:(z.data||[]);a.forEach(function(x){if(x&&x.s&&x.s.slice(-4)==='USDT')S.ticks[x.s]={p:num(x.c),c:num(x.P),v:num(x.q)}});S.last=Date.now();manage();render()}catch(e){}};ws.onclose=function(){if(wsRetry<20){wsRetry++;setTimeout(connectWS,Math.min(15000,1000*wsRetry))}}}catch(e){setTimeout(connectWS,3000)}}
function candidates(kind){var arr=S.universe.map(function(sym){var a=S.analysis[sym]||{};return{symbol:sym,side:a.signal,score:num(a.score),atr:num(a.atr),p:num(S.ticks[sym]&&S.ticks[sym].p),c:num(S.ticks[sym]&&S.ticks[sym].c),spike:num(a.spike)}}).filter(function(x){return x.p>0&&(x.side==='BUY'||x.side==='SELL')});arr.sort(function(a,b){return b.score-a.score});return arr}
function occupied(sym){return S.positions.some(function(p){return p.symbol===sym})}
function openFuture(c,engine){if(S.mode!=='PAPER'||!c||occupied(c.symbol))return false;var px=c.p;if(!px)return false;var risk=S.equity*(S.risk/100),stop=Math.max(c.atr/px*1.25,.006),sl=c.side==='BUY'?px*(1-stop):px*(1+stop),tp=c.side==='BUY'?px*(1+stop*2):px*(1-stop*2),qty=risk/Math.max(px*stop,.00000001);S.positions.push({id:Date.now()+Math.random(),symbol:c.symbol,side:c.side,entry:px,current:px,qty:qty,sl:sl,tp:tp,risk:risk,engine:engine,opened:Date.now()});save();return true}
function autoEngine(){if(S.mode!=='PAPER'||!S.auto)return;var m=S.positions.filter(function(p){return p.engine==='MOMENTUM'}).length,s=S.positions.filter(function(p){return p.engine==='SCALPING'}).length;if(m<3){candidates('m').forEach(function(c){if(m<3&&openFuture(c,'MOMENTUM'))m++})}if(s<3){candidates('s').forEach(function(c){if(s<3&&openFuture(c,'SCALPING'))s++})}}
function manage(){var changed=false;S.positions.slice().forEach(function(p){var px=num(S.ticks[p.symbol]&&S.ticks[p.symbol].p);if(!px)return;p.current=px;p.pnl=(p.side==='BUY'?(px-p.entry):(p.entry-px))*p.qty;var hit=p.side==='BUY'?(px<=p.sl||px>=p.tp):(px>=p.sl||px<=p.tp);if(hit){S.realized+=p.pnl;S.equity+=p.pnl;S.history.push({time:Date.now(),symbol:p.symbol,side:p.side,entry:p.entry,exit:px,pnl:p.pnl,r:p.risk?p.pnl/p.risk:0,sl:p.sl,tp:p.tp,result:p.pnl>=0?'WIN':'LOSS',engine:p.engine});S.positions=S.positions.filter(function(x){return x.id!==p.id});changed=true}});if(changed){save();setTimeout(autoEngine,250)}}
function table(list){return '<div class="tablewrap"><table><thead><tr><th>#</th><th>COIN</th><th>PRICE</th><th>24H</th><th>VOL</th><th>5M</th><th>15M</th><th>SPIKE</th><th>SCORE</th><th>SIGNAL</th></tr></thead><tbody>'+list.map(function(x,i){var cls=x.side==='BUY'?'buyrow':x.side==='SELL'?'sellrow':'';return '<tr class="'+cls+'"><td>'+(i+1)+'</td><td><b>'+esc(x.symbol)+'</b></td><td>'+num(x.p).toLocaleString('en-IN',{maximumFractionDigits:8})+'</td><td class="'+(x.c>=0?'green':'red')+'">'+pct(x.c)+'</td><td>$'+num(x.v).toLocaleString('en-US',{maximumFractionDigits:0})+'</td><td>'+esc((S.analysis[x.symbol]||{}).trend5||'WAIT')+'</td><td>'+esc((S.analysis[x.symbol]||{}).trend15||'WAIT')+'</td><td>'+num(x.spike).toFixed(2)+'x</td><td>'+x.score+'</td><td><span class="badge '+(x.side==='BUY'?'buy':x.side==='SELL'?'sell':'watch')+'">'+x.side+'</span></td></tr>'}).join('')+'</tbody></table></div>'}
function positionsView(){return '<div class="positions">'+(S.positions.length?S.positions.map(function(p){return '<div class="pos"><b>'+esc(p.symbol)+'</b> <span class="'+(p.side==='BUY'?'buy':'sell')+'">'+p.side+'</span><div class="kv"><span>Engine</span><b>'+p.engine+'</b></div><div class="kv"><span>Entry / Current</span><b>'+p.entry+' / '+p.current+'</b></div><div class="kv"><span>SL / TP</span><b>'+p.sl+' / '+p.tp+'</b></div><div class="kv"><span>P&L</span><b class="'+(num(p.pnl)>=0?'green':'red')+'">'+money(p.pnl)+'</b></div></div>'}).join(''):'<div class="notice">No open paper positions.</div>')+'</div>'}
function historyView(){var h=S.history.slice().reverse();return '<div class="tablewrap"><table><thead><tr><th>TIME</th><th>COIN</th><th>SIDE</th><th>ENGINE</th><th>ENTRY</th><th>EXIT</th><th>P&L</th><th>R</th><th>RESULT</th></tr></thead><tbody>'+h.map(function(x){return '<tr><td>'+new Date(x.time).toLocaleString()+'</td><td>'+x.symbol+'</td><td>'+x.side+'</td><td>'+x.engine+'</td><td>'+x.entry+'</td><td>'+x.exit+'</td><td class="'+(x.pnl>=0?'green':'red')+'">'+money(x.pnl)+'</td><td>'+num(x.r).toFixed(2)+'R</td><td>'+x.result+'</td></tr>'}).join('')+'</tbody></table></div>'}
function optionView(){return '<div class="panel"><h2>Options Paper Engine</h2><div class="sub">Options auto-slot is reserved for 4 contracts. It stays PAPER-only until an options mark/contract is confirmed.</div><div class="notice">4 option slots · CALL/PUT selection architecture ready · no real orders are sent.</div></div>'}
function render(){var total=S.positions.length,m=S.positions.filter(function(p){return p.engine==='MOMENTUM'}).length,sc=S.positions.filter(function(p){return p.engine==='SCALPING'}).length,op=S.optionPositions.length;var unreal=S.positions.reduce(function(a,p){return a+num(p.pnl)},0),eq=S.equity+unreal;var content='';if(S.tab==='overview')content='<div class="panel"><h2>AUTO PAPER ENGINE</h2><div class="sub">Automatic allocation: 3 Momentum + 3 Scalping + 4 Options = 10 slots. PAPER mode only.</div><div class="engine"><div class="slot"><span>Momentum</span><br><b>'+m+'/3</b><div class="bar"><i style="width:'+(m/3*100)+'%"></i></div></div><div class="slot"><span>Scalping</span><br><b>'+sc+'/3</b><div class="bar"><i style="width:'+(sc/3*100)+'%"></i></div></div><div class="slot"><span>Options</span><br><b>'+op+'/4</b><div class="bar"><i style="width:'+(op/4*100)+'%"></i></div></div><div class="slot"><span>Total</span><br><b>'+total+'/10</b><div class="bar"><i style="width:'+(Math.min(total,10)/10*100)+'%"></i></div></div></div></div><div class="panel"><h2>Top Momentum Signals</h2><div class="sub">'+S.universe.length+' Binance USDT perpetual coins loaded · '+S.deep+' deeply analyzed in rotating batches.</div>'+table(candidates('m').slice(0,25))+'</div>';else if(S.tab==='momentum')content='<div class="panel"><h2>Momentum</h2><div class="sub">5m + 15m trend, 24H direction and volume confirmation.</div>'+table(candidates('m').slice(0,60))+'</div>';else if(S.tab==='scalping')content='<div class="panel"><h2>Scalping</h2><div class="sub">1m + 5m + 15m confirmation, volume spike and ATR risk.</div>'+table(candidates('s').slice(0,60))+'</div>';else if(S.tab==='positions')content='<div class="panel"><h2>Open Positions</h2>'+positionsView()+'</div>';else if(S.tab==='history')content='<div class="panel"><h2>Trade History</h2>'+historyView()+'</div>';else if(S.tab==='options')content=optionView();else content='<div class="panel"><h2>Settings</h2><div class="controls"><label>Risk % <input id="risk" type="number" min="0.1" max="5" step="0.1" value="'+S.risk+'"></label><button onclick="applyRisk()">Apply</button><button onclick="resetPaper()">Reset Paper Account</button></div><p class="sub">LIVE architecture is server-side only. This browser never contains Binance API secrets.</p></div>';
q('#app').innerHTML='<div class="top"><div><div class="brand">⚡ BINANCE COMMAND CENTER</div><div class="muted"><span class="dot"></span>'+S.universe.length+' coins · '+(S.error?'ERROR: '+esc(S.error):S.scanning?'SCANNING':'LIVE DATA')+'</div></div><div class="mode"><button class="'+(S.mode==='PAPER'?'on':'')+'" onclick="setMode(\'PAPER\')">PAPER</button><button class="'+(S.mode==='LIVE'?'on':'')+'" onclick="setMode(\'LIVE\')">LIVE</button></div></div><div class="grid"><div class="card"><div class="muted">EQUITY</div><div class="metric">'+money(eq)+'</div></div><div class="card"><div class="muted">REALIZED P&L</div><div class="metric '+(S.realized>=0?'green':'red')+'">'+money(S.realized)+'</div></div><div class="card"><div class="muted">OPEN</div><div class="metric">'+total+'/10</div></div><div class="card"><div class="muted">ANALYZED</div><div class="metric blue">'+S.deep+'/'+S.universe.length+'</div></div></div><div class="nav">'+['overview','momentum','scalping','positions','history','options','settings'].map(function(t){return '<button class="'+(S.tab===t?'active':'')+'" onclick="appTab(\''+t+'\')">'+t.toUpperCase()+'</button>'}).join('')+'</div>'+content+'<div class="footer">Binance market data · Paper trading default · Live orders remain locked server-side</div>'}
window.appTab=function(t){S.tab=t;render()};window.setMode=function(m){if(m==='LIVE'){alert('LIVE mode is locked for safety. Paper trading remains active until server-side live unlock is explicitly configured.');return}S.mode='PAPER';save();render()};window.applyRisk=function(){var x=num(q('#risk').value);if(x>=.1&&x<=5)S.risk=x;save();render()};window.resetPaper=function(){if(confirm('Reset paper equity, positions and history?')){S.positions=[];S.history=[];S.equity=10000;S.realized=0;save();render()}};
load();render();loadUniverse();setInterval(function(){if(!S.scanningBatch)scanBatch()},12000);setInterval(function(){manage();autoEngine()},5000);setInterval(render,3000);
})();</script></body></html>
