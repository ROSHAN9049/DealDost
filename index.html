<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Command Center</title><style>*{box-sizing:border-box}body{margin:0;background:#060a12;color:#e8eef8;font:14px system-ui}.app{max-width:1450px;margin:auto;padding:12px}.top,.card,.panel,.slot,.pos{background:#0b1421;border:1px solid #20324a;border-radius:14px;padding:13px}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:900}.muted{color:#8495aa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.metric{font-size:23px;font-weight:900}.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button,.controls button{background:#111e2e;color:#d8e4f2;border:1px solid #2b405b;border-radius:8px;padding:8px 11px}.active{background:#1b6048!important}.engine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bar{height:6px;background:#18273a;border-radius:5px;margin-top:7px}.bar i{display:block;height:100%;background:#2bd18a}.tablewrap{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #17263a;white-space:nowrap;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}th{color:#8294ac;font-size:11px}.buy{color:#32df8a}.sell{color:#ff6075}.watch{color:#8798ad}.positions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.kv{display:flex;justify-content:space-between;margin-top:5px;color:#8798ae}.kv b{color:#eef4fb}.notice{padding:10px;background:#111d2c;border-radius:9px;color:#93a4b9}@media(max-width:800px){.grid,.engine{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.brand{font-size:18px}}</style></head><body><div id="app"><div style="padding:20px;font-weight:700">Loading Binance Scanner…</div></div><script>window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!a.querySelector('.app'))a.innerHTML='<div style="padding:20px"><b>Scanner startup error</b><div style="margin-top:8px;color:#ff6075">'+String(e.message||'Unknown error')+'</div></div>'});</script><script src="/app.js?v=20260915"></script><script src="/fees.js?v=20260915"></script></body></html>
