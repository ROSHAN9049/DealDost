<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Command Center</title><style>*{box-sizing:border-box}body{margin:0;background:#050913;color:#e8eef8;font:14px system-ui}.app{max-width:1450px;margin:auto;padding:12px}.top,.card,.panel,.pos,.optbox{background:linear-gradient(145deg,#0c1726,#09111d);border:1px solid #203b58;border-radius:14px;padding:13px;box-shadow:0 4px 18px rgba(0,0,0,.22)}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:900;background:linear-gradient(90deg,#fff,#7ee7ff);-webkit-background-clip:text;background-clip:text;color:transparent}.muted{color:#8495aa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.card{position:relative;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:#2b8cff}.card:nth-child(2):before{background:#22c982}.card:nth-child(3):before{background:#ff5870}.card:nth-child(4):before{background:#a879ff}.metric{font-size:23px;font-weight:900;margin-top:3px}.pnl-positive{color:#32df8a!important}.pnl-negative{color:#ff6075!important}.pnl-zero{color:#9aaabd!important}.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button,.controls button,.panel button{background:#111e2e;color:#d8e4f2;border:1px solid #2b405b;border-radius:9px;padding:8px 11px;transition:.18s}.active{background:linear-gradient(135deg,#176847,#15906a)!important;border-color:#38dc9b!important;color:#fff!important;box-shadow:0 0 14px rgba(50,223,138,.18)}.controls button:nth-child(2).active{background:linear-gradient(135deg,#8b2638,#d83d58)!important;border-color:#ff6b7e!important}.engine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{background:#0c1827;border:1px solid #213b56;border-radius:11px;padding:10px;text-align:center;color:#91a5ba}.slot b{display:block;font-size:18px;color:#eaf3ff;margin-top:2px}.tablewrap{overflow:auto;border:1px solid #1b3047;border-radius:11px}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #17263a;white-space:nowrap;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}th{color:#8294ac;font-size:11px;background:#0a1320;position:sticky;top:0}.buy{color:#32df8a!important;font-weight:800}.sell{color:#ff6075!important;font-weight:800}.watch{color:#ffc857!important;font-weight:700}.notice{padding:10px;background:#101d2c;border:1px solid #20364e;border-radius:9px;color:#93a4b9}.notice.buy{background:rgba(32,201,130,.08)}.notice.sell{background:rgba(255,88,112,.08)}.pos{margin:8px 0;border-left:3px solid #2b8cff}.optbox{margin:8px 0;border-left:3px solid #a879ff}.optbox button{margin-top:9px;background:linear-gradient(135deg,#46317e,#704dc0);border-color:#9b7ae4}@media(max-width:800px){.grid,.engine{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.brand{font-size:18px}.metric{font-size:19px}.app{padding:8px}}</style></head><body><div id="app"><div style="padding:20px;font-weight:700">Loading Binance Scanner…</div></div><script>window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!a.querySelector('.app'))a.innerHTML='<div style="padding:20px"><b>Scanner startup error</b><div style="margin-top:8px;color:#ff6075">'+String(e.message||'Unknown error')+'</div></div>'});</script><script src="/app-professional.js?v=20260915-1"></script><script src="/options-fix.js?v=20260915-2"></script><script>(function(){function paint(){var a=document.getElementById('app');if(!a)return;var ms=a.querySelectorAll('.card .metric');ms.forEach(function(x,i){var v=parseFloat(String(x.textContent).replace(/[^0-9+\-.]/g,''));x.classList.remove('pnl-positive','pnl-negative','pnl-zero');if(i===1||i===2)x.classList.add(v>0?'pnl-positive':v<0?'pnl-negative':'pnl-zero')});a.querySelectorAll('table tr').forEach(function(r){var c=r.querySelectorAll('td');if(c.length>=8){var sig=c[7],txt=sig.textContent.trim().toUpperCase();sig.classList.remove('buy','sell','watch');sig.classList.add(txt==='BUY'?'buy':txt==='SELL'?'sell':'watch')}})}var o=new MutationObserver(paint);o.observe(document.getElementById('app'),{childList:true,subtree:true,characterData:true});setInterval(paint,1000);paint()})();</script></body></html>
