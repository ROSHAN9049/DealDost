<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>Binance Command Center</title><link rel="preconnect" href="https://fonts.googleapis.com"><style id="app-style">*{box-sizing:border-box}body{margin:0;background:#060a12;color:#e8eef8;font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1500px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:18px 20px;border:1px solid #1f3048;border-radius:18px;background:linear-gradient(135deg,#0d1625,#0a111d);position:sticky;top:8px;z-index:10;backdrop-filter:blur(14px)}.brand{font-size:23px;font-weight:900}.muted{color:#8393aa}.live{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:#20e080;box-shadow:0 0 14px #20e080}.mode button{padding:8px 13px;border:1px solid #30425c;background:#111b2a;color:#b8c7da}.mode .on{background:#20a96b;color:#fff;border-color:#36e39a}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.card{background:#0c1421;border:1px solid #1d2c41;border-radius:16px;padding:14px}.metric{font-size:24px;font-weight:900;margin-top:5px}.green{color:#32df8a}.red{color:#ff5f72}.yellow{color:#ffd166}.blue{color:#58a6ff}.nav{display:flex;gap:7px;overflow:auto;margin:12px 0}.nav button{border:1px solid #203149;background:#0d1624;color:#aebdd0;border-radius:10px;padding:9px 13px;white-space:nowrap}.nav .active{background:#18304e;color:#fff;border-color:#3975b8}.panel{background:#0a111c;border:1px solid #1d2c41;border-radius:16px;padding:15px;margin-bottom:12px}.panel h2{margin:0 0 4px;font-size:17px}.sub{color:#7f90a7;font-size:12px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.tablewrap{overflow:auto;border:1px solid #1b2b40;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:980px}th,td{padding:9px 10px;border-bottom:1px solid #172438;text-align:right;white-space:nowrap}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}th{position:sticky;top:0;background:#111c2c;color:#8294ac;font-size:11px}.buyrow{background:linear-gradient(90deg,rgba(23,179,109,.16),transparent)}.sellrow{background:linear-gradient(90deg,rgba(242,71,91,.16),transparent)}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.buy{color:#35e28e}.sell{color:#ff6275}.watch{color:#8797ad}.badge.buy{background:#123b2b}.badge.sell{background:#421c26}.badge.watch{background:#182334}.posgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:9px}.pos{border:1px solid #263750;border-radius:12px;padding:12px;background:#0e1725}.poshead{display:flex;justify-content:space-between;font-weight:900}.kv{display:flex;justify-content:space-between;margin-top:6px;color:#8ea0b7}.kv b{color:#e7eef7}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input,.controls select{background:#0b1421;border:1px solid #2a3b55;color:#fff;border-radius:9px;padding:8px}.controls button{border:1px solid #2a3b55;background:#122034;color:#fff;border-radius:9px;padding:8px 12px}.controls .danger{background:#4a1c26;border-color:#87313f}.notice{padding:10px;border-radius:10px;background:#111d2d;color:#91a2b9;font-size:12px}.optiongrid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.chain{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.contract{border:1px solid #233650;border-radius:11px;padding:10px;background:#0d1624}.footer{color:#61728a;text-align:center;padding:18px;font-size:11px}@media(max-width:900px){.grid4,.stats{grid-template-columns:repeat(2,1fr)}.optiongrid{grid-template-columns:1fr}.top{position:static}}@media(max-width:520px){.app{padding:9px}.grid4,.stats{grid-template-columns:1fr 1fr}.brand{font-size:18px}.metric{font-size:20px}}</style></head><body><div id="app"></div><script>(function(){const S={mode:'PAPER',tab:'overview',universe:[],ticks:{},analysis:{},history:[],positions:[],equity:10000,start:10000,realized:0,options:[],optionPaper:[],last:0,deep:0,risk:.5,max:3};const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));const n=x=>Number(x)||0;const money=x=>'₹'+n(x).toLocaleString('en-IN',{maximumFractionDigits:2});const pct=x=>(n(x)>=0?'+':'')+n(x).toFixed(2)+'%';const api=p=>fetch('/api/binance-market?path='+encodeURIComponent(p),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Binance API '+r.status);return r.json()});const wsUrl='wss://fstream.binance.com/stream';let ws,kl={};
function reset(){try{const x=JSON.parse(localStorage.getItem('bd-v1')||'{}');Object.assign(S,x)}catch{}S.history=Array.isArray(S.history)?S.history:[];S.positions=Array.isArray(S.positions)?S.positions:[];S.equity=n(S.equity)||10000}
function save(){localStorage.setItem('bd-v1',JSON.stringify({mode:S.mode,history:S.history.slice(-200),positions:S.positions,equity:S.equity,start:S.start,realized:S.realized,risk:S.risk,max:S.max}))}
function ema(a,p=9){if(!a.length)return 0;let k=2/(p+1),e=n(a[0]);for(let i=1;i<a.length;i++)e=n(a[i])*k+e*(1-k);return e}function atr(a,p=14){if(a.length<p+1)return 0;let s=0;for(let i=a.length-p;i<a.length;i++){let h=n(a[i][2]),l=n(a[i][3]),pc=n(a[i-1][4]);s+=Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc))}return s/p}
function analyse(s){const k=kl[s.symbol]||{};if(!k.m1||!k.m5||!k.m15)return{signal:'WATCH',score:0,spike:0};const c1=k.m1.map(x=>n(x[4])),c5=k.m5.map(x=>n(x[4])),c15=k.m15.map(x=>n(x[4])),v=k.m5.map(x=>n(x[5]));const b1=c1.at(-1)>ema(c1)&&c1.at(-1)>c1.at(-2),b5=c5.at(-1)>ema(c5)&&c5.at(-1)>c5.at(-2),b15=c15.at(-1)>ema(c15),d1=c1.at(-1)<ema(c1)&&c1.at(-1)<c1.at(-2),d5=c5.at(-1)<ema(c5)&&c5.at(-1)<c5.at(-2),d15=c15.at(-1)<ema(c15),base=v.slice(-11,-1).reduce((a,b)=>a+b,0)/10,sp=base?v.at(-1)/base:0,trend=(b5&&b15)?'BUY':(d5&&d15)?'SELL':'WATCH',dir=n(s.p)>0?'BUY':n(s.p)<0?'SELL':'WATCH',score=Math.round(Math.min(Math.abs(n(s.p))*8,35)+Math.min(sp*12,30)+(trend!=='WATCH'?35:0));const ready=trend===dir&&sp>=1.25&&score>=75;return{signal:ready?trend:'WATCH',score,spike:sp,trend5:b5?'BULLISH':d5?'BEARISH':'WAIT',trend15:b15?'BULLISH':d15?'BEARISH':'WAIT',atr:atr(k.m5),reason:ready?'Trend + 24H + volume confirmed':'Confirmation pending'}}
async function universe(){try{const e=await api('/fapi/v1/exchangeInfo');S.universe=e.symbols.filter(x=>x.contractType==='PERPETUAL'&&x.quoteAsset==='USDT'&&x.status==='TRADING').map(x=>x.symbol).sort();const t=await api('/fapi/v1/ticker/24hr');S.ticks={};for(const x of t)if(S.universe.includes(x.symbol))S.ticks[x.symbol]={p:n(x.lastPrice),c:n(x.priceChangePercent),v:n(x.quoteVolume)};S.last=Date.now();render()}catch(e){console.error(e)}}
function startTicker(){try{ws=new WebSocket(wsUrl);ws.onopen=()=>ws.send(JSON.stringify({method:'SUBSCRIBE',params:['!ticker@arr'],id:1}));ws.onmessage=e=>{try{const a=JSON.parse(e.data);const d=Array.isArray(a)?a:(a.data||[]);for(const x of d)if(x?.s?.endsWith('USDT'))S.ticks[x.s]={p:n(x.c),c:n(x.P),v:n(x.q)};S.last=Date.now()}catch{}};ws.onclose=()=>setTimeout(startTicker,3000)}catch{setTimeout(startTicker,3000)}}
async function candles(symbol){try{const [a,b,c]=await Promise.all(['1m','5m','15m'].map(iv=>api('/fapi/v1/klines?symbol='+symbol+'&interval='+iv+'&limit=40')));kl[symbol]={m1:a,m5:b,m15:c};S.deep++}catch{}}
let cursor=0;async function deepScan(){if(!S.universe.length)return;const batch=S.universe.slice(cursor,cursor+24);cursor=(cursor+24)%S.universe.length;await Promise.all(batch.map(async symbol=>{await candles(symbol);const t=S.ticks[symbol];if(t)S.analysis[symbol]=analyse({symbol,p:t.c}||t)}));render()}
function price(sym){return n(S.ticks[sym]?.p)}function openPaper(a,side){if(S.mode!=='PAPER'||S.positions.length>=S.max)return;const sym=a.symbol,px=price(sym);if(!px)return;const stop=Math.max(a.atr/px*1.2,.008),sl=side==='BUY'?px*(1-stop):px*(1+stop),tp=side==='BUY'?px*(1+stop*2):px*(1-stop*2),risk=S.equity*(S.risk/100),qty=risk/Math.max(px*stop,.00000001);S.positions.push({id:Date.now()+Math.random(),symbol:sym,side,entry:px,current:px,qty,sl,tp,risk,opened:Date.now(),engine:S.tab});save();render()}
function manage(){let changed=false;for(const p of [...S.positions]){const px=price(p.symbol);if(!px)continue;p.current=px;p.pnl=(p.side==='BUY'?(px-p.entry):(p.entry-px))*p.qty;const hit=p.side==='BUY'?(px<=p.sl||px>=p.tp):(px>=p.sl||px<=p.tp);if(hit){S.realized+=p.pnl;S.equity+=p.pnl;S.history.push({time:Date.now(),symbol:p.symbol,side:p.side,entry:p.entry,exit:px,pnl:p.pnl,r:p.pnl/p.risk,sl:p.sl,tp:p.tp,result:p.pnl>=0?'WIN':'LOSS',engine:p.engine});S.positions=S.positions.filter(x=>x.id!==p.id);changed=true}}if(changed)save();render()}
function signalRows(kind){return S.universe.map(symbol=>{const t=S.ticks[symbol]||{},a=S.analysis[symbol]||{signal:'WATCH',score:0,spike:0,trend5:'WAIT',trend15:'WAIT'};return{symbol,p:t.p,c:t.c,v:t.v,...a}}).filter(x=>x.p).sort((a,b)=>(b.score-a.score)||Math.abs(b.c)-Math.abs(a.c)).slice(0,60)}
function card(title,value,cls=''){return '<div class="card"><div class="muted">'+title+'</div><div class="metric '+cls+'">'+value+'</div></div>'}
function nav(){return ['overview','momentum','scalping','positions','history','options','settings'].map(x=>'<button class="'+(S.tab===x?'active':'')+'" onclick="appTab(\''+x+'\')">'+x.toUpperCase()+'</button>').join('')}
function rows(list){return '<div class="tablewrap"><table><thead><tr><th>#</th><th>COIN</th><th>PRICE</th><th>24H</th><th>VOL</th><th>5M</th><th>15M</th><th>SPIKE</th><th>SCORE</th><th>SIGNAL</th></tr></thead><tbody>'+list.map((x,i)=>'<tr class="'+(x.signal==='BUY'?'buyrow':x.signal==='SELL'?'sellrow':'')+'"><td>'+(i+1)+'</td><td><b>'+esc(x.symbol)+'</b></td><td>'+n(x.p).toLocaleString('en-IN',{maximumFractionDigits:8})+'</td><td class="'+(n(x.c)>=0?'green':'red')+'">'+pct(x.c)+'</td><td>'+('$'+n(x.v).toLocaleString('en-US',{maximumFractionDigits:0}))+'</td><td>'+esc(x.trend5||'WAIT')+'</td><td>'+esc(x.trend15||'WAIT')+'</td><td>'+n(x.spike).toFixed(2)+'x</td><td>'+n(x.score)+'</td><td><span class="badge '+(x.signal==='BUY'?'buy':x.signal==='SELL'?'sell':'watch')+'">'+x.signal+'</span></td></tr>').join('')+'</tbody></table></div>'}
function positionView(){return '<div class="posgrid">'+(S.positions.length?S.positions.map(p=>'<div class="pos"><div class="poshead"><span>'+p.symbol+'</span><span class="'+(p.side==='BUY'?'buy':'sell')+'">'+p.side+'</span></div><div class="kv"><span>Entry</span><b>'+p.entry+'</b></div><div class="kv"><span>Current</span><b>'+p.current+'</b></div><div class="kv"><span>Qty</span><b>'+n(p.qty).toFixed(4)+'</b></div><div class="kv"><span>SL / TP</span><b>'+p.sl+' / '+p.tp+'</b></div><div class="kv"><span>Live P&L</span><b class="'+(n(p.pnl)>=0?'green':'red')+'">'+money(p.pnl)+'</b></div></div>').join(''):'<div class="notice">No open positions.</div>')+'</div>'}
function historyView(){const h=S.history.slice().reverse();return '<div class="tablewrap"><table><thead><tr><th>TIME</th><th>COIN</th><th>SIDE</th><th>ENTRY</th><th>EXIT</th><th>P&L</th><th>R</th><th>SL</th><th>TP</th><th>RESULT</th><th>ENGINE</th></tr></thead><tbody>'+h.map(x=>'<tr><td>'+new Date(x.time).toLocaleTimeString()+'</td><td>'+x.symbol+'</td><td>'+x.side+'</td><td>'+x.entry+'</td><td>'+x.exit+'</td><td class="'+(x.pnl>=0?'green':'red')+'">'+money(x.pnl)+'</td><td>'+n(x.r).toFixed(2)+'R</td><td>'+x.sl+'</td><td>'+x.tp+'</td><td class="'+(x.pnl>=0?'green':'red')+'">'+x.result+'</td><td>'+x.engine+'</td></tr>').join('')+'</tbody></table></div>'}
async function options(){try{S.options=await api('/eapi/v1/exchangeInfo');render()}catch(e){S.options=[]}}
function optionsView(){const arr=Array.isArray(S.options?.optionSymbols)?S.options.optionSymbols:(Array.isArray(S.options?.symbols)?S.options.symbols:[]);return '<div class="optiongrid"><div class="panel"><h2>🧩 Binance Options Chain</h2><div class="sub">European options · CALL / PUT · paper-ready contract selector</div><div class="chain">'+arr.slice(0,30).map(x=>'<div class="contract"><b>'+esc(x.symbol||x.optionSymbol||'OPTION')+'</b><div class="muted">'+esc(x.side||x.contractType||'CALL/PUT')+'</div><div class="controls" style="margin-top:8px"><button onclick="paperOption(\''+esc(x.symbol||x.optionSymbol||'')+'\',\'BUY\')">Paper BUY</button><button onclick="paperOption(\''+esc(x.symbol||x.optionSymbol||'')+'\',\'SELL\')">Paper SELL</button></div></div>').join('')+'</div></div><div class="panel"><h2>⚠️ Live Options</h2><div class="notice">LIVE options orders use the same server-side execution adapter. API secrets never belong in the browser. LIVE is locked until server credentials and an explicit unlock flag are configured.</div></div></div>'}
window.paperOption=(symbol,side)=>{S.optionPaper.push({time:Date.now(),symbol,side,status:'PAPER'});render()};window.appTab=x=>{S.tab=x;if(x==='options'&&!S.options.length)options();render()};window.setMode=m=>{if(m==='LIVE'&&!confirm('LIVE sends real Binance orders only after server credentials are configured. Continue?'))return;S.mode=m;save();render()};
function settings(){return '<div class="controls"><label>Risk % <input id="risk" value="'+S.risk+'"></label><label>Max positions <input id="max" value="'+S.max+'"></label><button onclick="saveSettings()">Save controls</button><button class="danger" onclick="resetPaper()">Reset paper account</button></div><div class="notice" style="margin-top:10px">LIVE execution is server-side only. Use Binance API keys with the minimum permissions needed. The browser never stores secrets.</div>'};window.saveSettings=()=>{S.risk=Math.max(.1,Math.min(2,n($('#risk').value)));S.max=Math.max(1,Math.min(10,n($('#max').value)));save();render()};window.resetPaper=()=>{if(confirm('Reset paper equity, positions and history?')){S.equity=10000;S.realized=0;S.positions=[];S.history=[];save();render()}};
function overview(){const list=signalRows();return '<div class="grid4">'+card('ALL ACTIVE PERPETUALS',S.universe.length,'blue')+card('BUY READY',list.filter(x=>x.signal==='BUY').length,'green')+card('SELL READY',list.filter(x=>x.signal==='SELL').length,'red')+card('EQUITY',money(S.equity),S.equity>=S.start?'green':'red')+'</div><div class="panel"><h2>🌐 Binance All-Coin Scanner</h2><div class="sub">Full active USDT perpetual universe · rotating 1m/5m/15m deep analysis · green BUY / red SELL</div>'+rows(list)+'</div><div class="panel"><h2>📌 Open Positions · '+S.positions.length+'/'+S.max+'</h2>'+positionView()+'</div>'}
function tabContent(){if(S.tab==='overview')return overview();if(S.tab==='momentum')return '<div class="panel"><h2>🟢 MOMENTUM ENGINE</h2><div class="sub">5M + 15M trend · 24H direction · volume expansion · score ≥75</div>'+rows(signalRows('momentum'))+'</div>';if(S.tab==='scalping')return '<div class="panel"><h2>⚡ SCALPING ENGINE</h2><div class="sub">1M + 5M + 15M confirmation · volume spike ≥1.25x · ATR SL · 1.5R target</div>'+rows(signalRows('scalping'))+'</div>';if(S.tab==='positions')return '<div class="panel"><h2>📌 LIVE/PAPER POSITIONS</h2>'+positionView()+'</div>';if(S.tab==='history')return '<div class="panel"><h2>🧾 COMPLETE TRADE HISTORY</h2>'+historyView()+'</div>';if(S.tab==='options')return optionsView();return '<div class="panel"><h2>⚙️ ENGINE SETTINGS</h2>'+settings()+'</div>'}
function render(){document.getElementById('app').innerHTML='<div class="app"><header class="top"><div><div class="brand">⚡ BINANCE COMMAND CENTER</div><div class="muted">Futures Scanner · Momentum · Scalping · P&L · Options</div></div><div class="live"><span class="dot"></span> BINANCE LIVE DATA <div class="mode"><button class="'+(S.mode==='PAPER'?'on':'')+'" onclick="setMode(\'PAPER\')">PAPER</button><button class="'+(S.mode==='LIVE'?'on':'')+'" onclick="setMode(\'LIVE\')">LIVE</button></div></div></header><div class="grid4">'+card('EQUITY',money(S.equity),S.equity>=S.start?'green':'red')+card('REALIZED P&L',money(S.realized),S.realized>=0?'green':'red')+card('OPEN',S.positions.length+'/'+S.max,'yellow')+card('ANALYZED',S.deep,'blue')+'</div><div class="nav">'+nav()+'</div>'+tabContent()+'<div class="footer">Public Binance market data · PAPER is safe by default · LIVE execution requires server-side Binance credentials and remains protected.</div></div>'}
reset();render();universe();startTicker();setInterval(()=>{deepScan();manage()},15000);setInterval(()=>{manage();render()},1000);})();</script></body></html>
