<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Command Center</title><style>*{box-sizing:border-box}body{margin:0;background:#050913;color:#e8eef8;font:14px system-ui}.app{max-width:1450px;margin:auto;padding:12px}.top,.card,.panel,.pos,.optbox{background:linear-gradient(145deg,#0c1726,#09111d);border:1px solid #203b58;border-radius:14px;padding:13px;box-shadow:0 4px 18px rgba(0,0,0,.22)}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:900;background:linear-gradient(90deg,#fff,#7ee7ff);-webkit-background-clip:text;background-clip:text;color:transparent}.muted{color:#8495aa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.card{position:relative;overflow:hidden}.metric{font-size:23px;font-weight:900;margin-top:3px}.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button,.controls button{background:#111e2e;color:#d8e4f2;border:1px solid #2b405b;border-radius:9px;padding:8px 11px}.active{background:#176847!important;border-color:#38dc9b!important;color:#fff!important}.controls button:nth-child(2).active{background:#8b2638!important;border-color:#ff6b7e!important}.engine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{background:#0c1827;border:1px solid #213b56;border-radius:11px;padding:10px;text-align:center;color:#91a5ba}.slot b{display:block;font-size:18px;color:#eaf3ff;margin-top:2px}.tablewrap{overflow:auto;border:1px solid #1b3047;border-radius:11px}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #17263a;white-space:nowrap;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}th{color:#8294ac;font-size:11px;background:#0a1320}.buy{color:#32df8a!important;font-weight:800}.sell{color:#ff6075!important;font-weight:800}.watch{color:#ffc857!important;font-weight:700}.notice{padding:10px;margin:8px 0;background:#101d2c;border:1px solid #20364e;border-radius:9px;color:#93a4b9}.notice.buy{background:rgba(32,201,130,.08)}.notice.sell{background:rgba(255,88,112,.08)}.pos{margin:8px 0;border-left:3px solid #2b8cff}@media(max-width:800px){.grid,.engine{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.brand{font-size:18px}.metric{font-size:19px}.app{padding:8px}}</style></head><body><div id="app"><div style="padding:20px;font-weight:700">Loading Binance Scanner…</div></div><script>window.addEventListener('error',function(e){var a=document.getElementById('app');if(a&&!a.querySelector('.app'))a.innerHTML='<div style="padding:20px"><b>Scanner startup error</b><div style="margin-top:8px;color:#ff6075">'+String(e.message||'Unknown error')+'</div></div>'});</script><script src="/app-professional-v2.js?v=20260915-3"></script><script>(function(){var a=document.getElementById('app');if(!a)return;new MutationObserver(function(){a.querySelectorAll('.metric').forEach(function(x,i){var v=parseFloat(x.textContent.replace(/[^0-9+\-.]/g,''));x.classList.toggle('buy',(i===1||i===2)&&v>0);x.classList.toggle('sell',(i===1||i===2)&&v<0)})}).observe(a,{childList:true,subtree:true})})();</script></body></html>
