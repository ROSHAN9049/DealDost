<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Command Center</title><style>*{box-sizing:border-box}body{margin:0;background:#060a12;color:#e8eef8;font:14px system-ui}.app{max-width:1450px;margin:auto;padding:12px}.top,.card,.panel,.slot,.pos{background:#0b1421;border:1px solid #20324a;border-radius:14px;padding:13px}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:22px;font-weight:900}.muted{color:#8495aa}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.metric{font-size:23px;font-weight:900}.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button,.controls button{background:#111e2e;color:#d8e4f2;border:1px solid #2b405b;border-radius:8px;padding:8px 11px}.active{background:#1b6048!important}.engine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bar{height:6px;background:#18273a;border-radius:5px;margin-top:7px}.bar i{display:block;height:100%;background:#2bd18a}.tablewrap{overflow:auto}table{width:100%;min-width:900px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #17263a;white-space:nowrap;text-align:right}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}th{color:#8294ac;font-size:11px}.buy{color:#32df8a}.sell{color:#ff6075}.watch{color:#8798ad}.badge{padding:3px 7px;border-radius:20px}.badge.buy{background:#123c2b}.badge.sell{background:#431c27}.positions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.kv{display:flex;justify-content:space-between;margin-top:5px;color:#8798ae}.kv b{color:#eef4fb}.notice{padding:10px;background:#111d2c;border-radius:9px;color:#93a4b9}@media(max-width:800px){.grid,.engine{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.brand{font-size:18px}}</style></head><body><div id="app"></div><script>(function(){'use strict';var S={tab:'overview',mode:'PAPER',auto:true,universe:[],ticks:{},analysis:{},kl:{},positions:[],history:[],equity:10000,realized:0,risk:.5,last:0,error:'',deep:0,scanned:{}},cursor=0,busy=false,optBusy=false,ws=null;var $=function(x){return document.querySelector(x)},N=function(x){x=Number(x);return isFinite(x)?x:0},M=function(x){return '₹'+N(x).toLocaleString('en-IN',{maximumFractionDigits:2})},P=function(x){return (N(x)>=0?'+':'')+N(x).toFixed(2)+'%',E=function(x){return String(x==null?'':x).replace(/[&<>]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])})};function save(){try{localStorage.setItem('bd-v4',JSON.stringify({positions:S.positions,history:S.history.slice(-300),equity:S.equity,realized:S.realized,risk:S.risk}))}catch(e){}}function load(){try{var x=JSON.parse(localStorage.getItem('bd-v4')||'{}');if(x.positions)S.positions=x.positions;if(x.history)S.history=x.history;if(N(x.equity)>0)S.equity=N(x.equity);S.realized=N(x.realized);S.risk=N(x.risk)||.5}catch(e){}}function api(p){return fetch('/api/binance-market?path='+encodeURIComponent(p),{cache:'no-store'}).then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw Error('API response invalid ('+r.status+')')}if(!r.ok)throw Error((j&&j.error)||('Binance API '+r.status));return j})})}function ema(a,p){if(!a.length)return 0;var k=2/(p+1),e=N(a[0]);for(var i=1;i<a.length;i++)e=N(a[i])*k+e*(1-k);return e}function atr(a){if(a.length<15)return 0;var s=0;for(var i=a.length-14;i<a.length;i++){var h=N(a[i][2]),l=N(a[i][3]),pc=N(a[i-1][4]);s+=Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc))}return s/14}function analyze(sym){var k=S.kl[sym],t=S.ticks[sym];if(!k||!t)return{signal:'WATCH',score:0,spike:0,atr:0};var c5=k.m5.map(function(x){return N(x[4])}),c15=k.m15.map(function(x){return N(x[4])}),v=k.m5.map(function(x){return N(x[5])});if(c5.length<20||c15.length<20)return{signal:'WATCH',score:0,spike:0,atr:0};var l5=c5[c5.length-1],p5=c5[c5.length-2],l15=c15[c15.length-1],e5=ema(c5,9),e15=ema(c15,13),bull=l5>e5&&l5>=p5&&l15>e15,bear=l5<e5&&l5<=p5&&l15<e15,base=0,n=Math.min(10,v.length-1);for(var i=v.length-1-n;i<v.length-1;i++)base+=v[i];base/=Math.max(1,n);var sp=base?v[v.length-1]/base:0,trend=bull?'BUY':bear?'SELL':'WATCH',dir=t.c>0?'BUY':t.c<0?'SELL':'WATCH',score=Math.round(Math.min(Math.abs(t.c)*6,30)+Math.min(sp*12,30)+(trend!=='WATCH'?40:0));var sig=trend===dir&&score>=58?'':trend==='BUY'&&score>=62?'BUY':trend==='SELL'&&score>=62?'SELL':'WATCH';if(trend===dir&&sp<1.03)sig='WATCH';return{signal:sig,score:score,spike:sp,atr:atr(k.m5),trend5:bull?'BULLISH':bear?'BEARISH':'WAIT',trend15:l15>e15?'BULLISH':l15<e15?'BEARISH':'WAIT'}}async function boot(){S.error='';try{var e=await api('/fapi/v1/exchangeInfo');S.universe=(e.symbols||[]).filter(function(x){return x.contractType==='PERPETUAL'&&x.quoteAsset==='USDT'&&x.status==='TRADING'}).map(function(x){return x.symbol});var t=await api('/fapi/v1/ticker/24hr');S.ticks={};(Array.isArray(t)?t:[]).forEach(function(x){if(S.universe.indexOf(x.symbol)>=0)S.ticks[x.symbol]={p:N(x.lastPrice),c:N(x.priceChangePercent),v:N(x.quoteVolume)}});S.universe.sort(function(a,b){return N(S.ticks[b]&&S.ticks[b].v)-N(S.ticks[a]&&S.ticks[a].v)});connect();await scan(true)}catch(e){S.error=e.message;render()}}function connect(){try{ws=new WebSocket('wss://fstream.binance.com/stream');ws.onopen=function(){ws.send(JSON.stringify({method:'SUBSCRIBE',params:['!ticker@arr'],id:1}))};ws.onmessage=function(ev){try{var z=JSON.parse(ev.data),a=Array.isArray(z)?z:(z.data||[]);a.forEach(function(x){if(x&&x.s&&S.ticks[x.s])S.ticks[x.s]={p:N(x.c),c:N(x.P),v:N(x.q)}});S.last=Date.now();manage();render()}catch(e){}};ws.onclose=function(){setTimeout(connect,4000)}}catch(e){setTimeout(connect,4000)}}async function scan(first){if(busy||!S.universe.length)return;busy=true;var batch=[],size=first?30:24;if(first){for(var j=0;j<Math.min(size,S.universe.length);j++)batch.push(S.universe[j])}else{for(var i=0;i<size;i++)batch.push(S.universe[(cursor+i)%S.universe.length]);cursor=(cursor+size)%S.universe.length}await Promise.all(batch.map(async function(sym){try{var r=await Promise.all(['1m','5m','15m'].map(function(iv){return api('/fapi/v1/klines?symbol='+sym+'&interval='+iv+'&limit=40')}));S.kl[sym]={m1:r[0],m5:r[1],m15:r[2]};S.analysis[sym]=analyze(sym);S.scanned[sym]=Date.now()}catch(e){}}));S.deep=Object.keys(S.scanned).length;busy=false;autoEngine();render()}function rows(){return S.universe.map(function(sym){var a=S.analysis[sym]||{},t=S.ticks[sym]||{};return{symbol:sym,side:a.signal||'WATCH',score:N(a.score),atr:N(a.atr),p:N(t.p),c:N(t.c),spike:N(a.spike),trend5:a.trend5||'WAIT',trend15:a.trend15||'WAIT'}}).filter(function(x){return x.p>0&&S.analysis[x.symbol]}).sort(function(a,b){return b.score-a.score})}function candidates(){return rows().filter(function(x){return x.side==='BUY'||x.side==='SELL'})}function momentumCandidates(){return candidates().filter(function(x){return x.score>=62&&(x.trend5==='BULLISH'&&x.trend15==='BULLISH'||x.trend5==='BEARISH'&&x.trend15==='BEARISH')})}function scalpCandidates(){return candidates().filter(function(x){return x.score>=58&&x.spike>=1.03})}function used(sym,engine){return S.positions.some(function(p){return p.symbol===sym&&p.engine===engine})}function open(c,engine){if(!c||used(c.symbol,engine))return false;var px=c.p,risk=S.equity*(S.risk/100),stop=Math.max(c.atr/Math.max(px,1e-9)*1.25,.006),sl=c.side==='BUY'?px*(1-stop):px*(1+stop),tp=c.side==='BUY'?px*(1+stop*2):px*(1-stop*2),qty=risk/Math.max(px*stop,1e-9);S.positions.push({id:Date.now()+Math.random(),symbol:c.symbol,side:c.side,entry:px,current:px,qty:qty,sl:sl,tp:tp,risk:risk,engine:engine,opened:Date.now(),kind:'FUTURES'});save();return true}function autoEngine(){if(S.mode!=='PAPER'||!S.auto)return;var m=S.positions.filter(function(p){return p.engine==='MOMENTUM'}).length,s=S.positions.filter(function(p){return p.engine==='SCALPING'}).length,mc=momentumCandidates(),sc=scalpCandidates();for(var i=0;i<mc.length&&m<3;i++)if(open(mc[i],'MOMENTUM'))m++;for(var j=0;j<sc.length&&s<3;j++)if(open(sc[j],'SCALPING'))s++;autoOptions()}async function autoOptions(){if(S.mode!=='PAPER'||!S.auto||optBusy)return;var count=S.positions.filter(function(p){return p.engine==='OPTIONS'}).length;if(count>=4)return;optBusy=true;try{var ex=await api('/eapi/v1/exchangeInfo'),sy=(ex.optionSymbols||ex.symbols||[]).filter(function(x){return x.status==='TRADING'||x.symbolStatus==='TRADING'});if(!sy.length){optBusy=false;return}var mk=await api('/eapi/v1/mark'),marks={};(Array.isArray(mk)?mk:[]).forEach(function(x){marks[x.symbol]=N(x.markPrice||x.price||x.bidPrice||x.askPrice)});var cs=candidates(),seen={};for(var i=0;i<cs.length&&count<4;i++){var base=cs[i].symbol.replace(/USDT$/,'');var opts=sy.filter(function(o){var os=String(o.underlying||o.underlyingSymbol||'').toUpperCase();return os.indexOf(base)>=0});opts.sort(function(a,b){return Math.abs(N(a.strike)-cs[i].p)-Math.abs(N(b.strike)-cs[i].p)});var o=null;for(var z=0;z<opts.length;z++){var nm=opts[z].symbol||opts[z].optionSymbol;if(marks[nm]&&!seen[nm]&&!S.positions.some(function(p){return p.symbol===nm})){{o=opts[z];break}}}if(!o)continue;var name=o.symbol||o.optionSymbol,px=marks[name];if(!px)continue;seen[name]=1;var optType=String(o.side||o.optionType||'').toUpperCase(),want=cs[i].side==='BUY'?'CALL':'PUT';if(optType&&optType!==want&&optType!=='CALL'&&optType!=='PUT')continue;if(optType&&optType!==want)continue;var risk=S.equity*(S.risk/100),sl=px*.7,tp=px*1.6,qty=Math.max(1,Math.floor(risk/Math.max(px*.3,1e-9)));S.positions.push({id:Date.now()+Math.random(),symbol:name,side:'BUY',entry:px,current:px,qty:qty,sl:sl,tp:tp,risk:risk,engine:'OPTIONS',opened:Date.now(),kind:'OPTION',underlying:base,optionType:want});count++}}catch(e){S.error='Options: '+e.message}optBusy=false;save();render()}async function refreshOptions(){var ops=S.positions.filter(function(p){return p.kind==='OPTION'});if(!ops.length)return;try{var mk=await api('/eapi/v1/mark'),marks={};(Array.isArray(mk)?mk:[]).forEach(function(x){marks[x.symbol]=N(x.markPrice||x.price||x.bidPrice||x.askPrice)});ops.forEach(function(p){if(marks[p.symbol]>0){p.current=marks[p.symbol];p.pnl=(p.current-p.entry)*p.qty}});manage(true)}catch(e){}}function manage(fromOption){var changed=false;S.positions.slice().forEach(function(p){var px;if(p.kind==='OPTION'){px=N(p.current)}else px=N(S.ticks[p.symbol]&&S.ticks[p.symbol].p);if(!px)return;p.current=px;if(p.kind!=='OPTION')p.pnl=(p.side==='BUY'?(px-p.entry):(p.entry-px))*p.qty;var hit=p.side==='BUY'?(px<=p.sl||px>=p.tp):(px>=p.sl||px<=p.tp);if(hit){S.realized+=p.pnl;S.equity+=p.pnl;S.history.push({time:Date.now(),symbol:p.symbol,side:p.side,engine:p.engine,entry:p.entry,exit:px,pnl:p.pnl,result:p.pnl>=0?'WIN':'LOSS'});S.positions=S.positions.filter(function(x){return x.id!==p.id});changed=true}});if(changed){save();setTimeout(autoEngine,300)}else if(!fromOption)save()}function nav(){return ['overview','momentum','scalping','positions','history','options','settings'].map(function(x){return '<button class="'+(S.tab===x?'active':'')+'" onclick="tab(\''+x+'\')">'+x.toUpperCase()+'</button>'}).join('')}function table(kind){var a=rows();if(kind==='momentum')a=a.filter(function(x){return x.side!=='WATCH'&&x.score>=62});if(kind==='scalping')a=a.filter(function(x){return x.side!=='WATCH'&&x.spike>=1.03});return '<div class="tablewrap"><table><tr><th>#</th><th>COIN</th><th>PRICE</th><th>24H</th><th>SPIKE</th><th>SCORE</th><th>5M</th><th>15M</th><th>SIGNAL</th></tr>'+a.slice(0,80).map(function(x,i){return '<tr><td>'+(i+1)+'</td><td><b>'+E(x.symbol)+'</b></td><td>'+x.p+'</td><td class="'+(x.c>=0?'buy':'sell')+'">'+P(x.c)+'</td><td>'+x.spike.toFixed(2)+'x</td><td>'+x.score+'</td><td>'+E(x.trend5)+'</td><td>'+E(x.trend15)+'</td><td class="'+(x.side==='BUY'?'buy':x.side==='SELL'?'sell':'watch')+'">'+x.side+'</td></tr>'}).join('')+'</table></div>'}function posView(){return '<div class="positions">'+(S.positions.length?S.positions.map(function(p){return '<div class="pos"><b>'+E(p.symbol)+'</b> <span class="'+(p.side==='BUY'?'buy':'sell')+'">'+p.side+'</span><div class="kv"><span>Engine</span><b>'+p.engine+'</b></div><div class="kv"><span>Entry / Current</span><b>'+p.entry+' / '+p.current+'</b></div><div class="kv"><span>SL / TP</span><b>'+p.sl+' / '+p.tp+'</b></div><div class="kv"><span>P&L</span><b class="'+(N(p.pnl)>=0?'buy':'sell')+'">'+M(p.pnl)+'</b></div></div>'}).join(''):'<div class="notice">No open paper positions.</div>')+'</div>'}function historyView(){return '<div class="tablewrap"><table><tr><th>TIME</th><th>SYMBOL</th><th>ENGINE</th><th>P&L</th><th>RESULT</th></tr>'+S.history.slice().reverse().map(function(x){return '<tr><td>'+new Date(x.time).toLocaleString()+'</td><td>'+E(x.symbol)+'</td><td>'+x.engine+'</td><td class="'+(x.pnl>=0?'buy':'sell')+'">'+M(x.pnl)+'</td><td>'+x.result+'</td></tr>'}).join('')+'</table></div>'}function optionView(){var o=S.positions.filter(function(p){return p.engine==='OPTIONS'}).length;return '<div class="notice">Options paper engine: <b>'+o+'/4</b>. Bullish signal → BUY CALL, bearish signal → BUY PUT. Premium-risk is capped in paper mode. Live orders remain server-side locked.</div>'+table('options')}function render(){var m=S.positions.filter(function(p){return p.engine==='MOMENTUM'}).length,s=S.positions.filter(function(p){return p.engine==='SCALPING'}).length,o=S.positions.filter(function(p){return p.engine==='OPTIONS'}).length,openp=S.positions.reduce(function(a,p){return a+N(p.pnl)},0);document.getElementById('app').innerHTML='<div class="app"><div class="top"><div><div class="brand">⚡ BINANCE COMMAND CENTER</div><div class="muted">PAPER · LIVE MARKET FEED '+(S.error?' · ERROR: '+E(S.error):S.last?' · STREAM OK':'')+'</div></div><div class="controls"><button onclick="mode()">PAPER</button><button onclick="toggleAuto()">AUTO '+(S.auto?'ON':'OFF')+'</button></div></div><div class="grid"><div class="card"><div class="muted">EQUITY</div><div class="metric">'+M(S.equity+openp)+'</div></div><div class="card"><div class="muted">REALIZED P&L</div><div class="metric '+(S.realized>=0?'buy':'sell')+'">'+M(S.realized)+'</div></div><div class="card"><div class="muted">OPEN P&L</div><div class="metric '+(openp>=0?'buy':'sell')+'">'+M(openp)+'</div></div><div class="card"><div class="muted">COINS / ANALYSED</div><div class="metric">'+S.universe.length+' / '+S.deep+'</div></div></div><div class="panel"><div class="engine"><div class="slot"><div class="muted">MOMENTUM</div><b>'+m+'/3</b><div class="bar"><i style="width:'+Math.min(100,m/3*100)+'%"></i></div></div><div class="slot"><div class="muted">SCALPING</div><b>'+s+'/3</b><div class="bar"><i style="width:'+Math.min(100,s/3*100)+'%"></i></div></div><div class="slot"><div class="muted">OPTIONS</div><b>'+o+'/4</b><div class="bar"><i style="width:'+Math.min(100,o/4*100)+'%"></i></div></div><div class="slot"><div class="muted">TOTAL</div><b>'+(m+s+o)+'/10</b><div class="bar"><i style="width:'+Math.min(100,(m+s+o)/10*100)+'%"></i></div></div></div></div><div class="nav">'+nav()+'</div><div class="panel">'+(S.tab==='overview'?'<h2>All-Coin Scanner</h2><div class="muted">Universe '+S.universe.length+' · Deep analysed '+S.deep+' · WATCH rows are now visible · auto paper engine '+(S.auto?'running':'paused')+'</div>'+table('all'):S.tab==='momentum'?'<h2>Momentum Signals</h2>'+table('momentum'):S.tab==='scalping'?'<h2>Scalping Signals</h2>'+table('scalping'):S.tab==='positions'?'<h2>Open Positions</h2>'+posView():S.tab==='history'?'<h2>Trade History</h2>'+historyView():S.tab==='options'?'<h2>Options</h2>'+optionView():S.tab==='settings'?'<h2>Settings</h2><div class="controls"><label>Risk % <input id="risk" value="'+S.risk+'" type="number" step=".1"></label><button onclick="setRisk()">SAVE</button><button onclick="resetPaper()">RESET PAPER</button></div>':'')+'</div><div class="footer">Binance market data · Paper trading default · Real orders remain locked server-side</div></div>'}window.tab=function(x){S.tab=x;render()};window.mode=function(){S.mode='PAPER';render()};window.toggleAuto=function(){S.auto=!S.auto;if(S.auto)autoEngine();render()};window.setRisk=function(){S.risk=Math.max(.1,Math.min(5,N($('#risk').value)||.5));save();render()};window.resetPaper=function(){S.positions=[];S.history=[];S.equity=10000;S.realized=0;save();render()};load();render();boot();setInterval(scan,20000);setInterval(function(){if(S.auto)autoEngine();render()},5000);setInterval(refreshOptions,5000)})();</script></body></html>
